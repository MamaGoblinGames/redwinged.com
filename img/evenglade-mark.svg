<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <title>Evenglade: a ring of trees around a clearing, breathing</title>
  <!-- The app icon's master: a ring, like trees around a clearing, with the ring's fading echo, like a breath. -->
